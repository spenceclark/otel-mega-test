# Local evidence profile (default, CI). No cloud exporter; OTLP JSON lines on disk are the
# authoritative source for trace assertions. One file per signal.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s

exporters:
  file/traces:
    path: /evidence/otel/traces.jsonl
    format: json
    flush_interval: 1s
  file/logs:
    path: /evidence/otel/logs.jsonl
    format: json
    flush_interval: 1s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/logs]
