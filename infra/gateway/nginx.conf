# Installed as /etc/nginx/conf.d/default.conf in the official nginx image, i.e. inside http {}.
# Same-origin gateway: serves the SPA, proxies /api/ to FastAPI and exactly two OTLP paths to the
# collector. It is not a general forwarder: every other /telemetry/ path is a 404.

# Telemetry rate limit, per client IP. Sizing: the 20-context concurrency test flushes traces + logs
# from one IP at roughly the same moment (~40 requests, plus exporter retries), so the burst must
# absorb ~100 requests without delay. Over the limit -> 429, which the OTLP exporter retries.
limit_req_zone $binary_remote_addr zone=telemetry:1m rate=20r/s;

# Origin check for telemetry ingestion. Not authentication (any non-browser client can omit or
# forge Origin); it only stops other web pages from posting into the collector via a browser.
map $http_origin $telemetry_origin_ok {
    default                 0;
    ""                      1;
    "http://127.0.0.1:5173" 1;
    "http://localhost:5173" 1;
    "http://web:8080"       1;
}

server {
    listen 8080;
    server_name _;

    # Docker's embedded DNS; variables in proxy_pass defer name resolution to request time,
    # so nginx starts even when api / otel-collector are not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $collector_upstream http://otel-collector:4318;

    # Never forward credentials upstream. Browsers scope cookies by host, not port, so cookies of any other
    # app on 127.0.0.1 ride along to this origin; neither the API nor the collector needs them. Inherited by
    # every proxied location below (none defines its own proxy_set_header).
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";

    root /usr/share/nginx/html;

    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }

    # Variable upstream without a URI part: the original request URI (path + query) is passed as-is.
    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /telemetry/v1/traces {
        if ($request_method != POST) { return 405; }
        if ($telemetry_origin_ok = 0) { return 403; }
        if ($content_type !~* "^application/x-protobuf$") { return 415; }
        client_max_body_size 1m;
        limit_req zone=telemetry burst=100 nodelay;
        limit_req_status 429;
        # Variable upstream with a URI part: the request URI is replaced entirely (query dropped).
        proxy_pass $collector_upstream/v1/traces;
    }

    location = /telemetry/v1/logs {
        if ($request_method != POST) { return 405; }
        if ($telemetry_origin_ok = 0) { return 403; }
        if ($content_type !~* "^application/x-protobuf$") { return 415; }
        client_max_body_size 1m;
        limit_req zone=telemetry burst=100 nodelay;
        limit_req_status 429;
        proxy_pass $collector_upstream/v1/logs;
    }

    location /telemetry/ {
        return 404;
    }
}
